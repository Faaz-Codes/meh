<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 32px; background:#f2f6ff; }
      .topbar { display:flex; justify-content:space-between; align-items:center; }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px; }
      .panel { background:white; border-radius:10px; padding:16px; box-shadow:0 8px 20px rgba(0,0,0,0.05); }
      ul { padding-left:16px; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1 id="title">Dashboard</h1>
      <button id="logout">Log out</button>
    </div>
    <p id="welcome"></p>

    <section class="grid">
      <div class="panel">
        <h2>Habits</h2>
        <ul id="habits"></ul>
      </div>
      <div class="panel">
        <h2>Journal</h2>
        <ul id="journal"></ul>
      </div>
    </section>

    <script type="module" src="/js/dashboard.js"></script>
  </body>
</html>

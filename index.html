<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Multi-User Dashboard</title>
    <style>
      body { font-family: Arial, sans-serif; background:#f7f7fb; display:flex; min-height:100vh; align-items:center; justify-content:center; }
      .card { width:360px; background:white; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,0.08); padding:24px; }
      input, button { width:100%; padding:10px; margin-top:10px; }
      .error { color:#c00; margin-top:10px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sign in</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
        <button type="submit">Log in</button>
      </form>
      <p class="error" id="error"></p>
    </main>
    <script type="module" src="./js/auth.js"></script>
  </body>
</html>
